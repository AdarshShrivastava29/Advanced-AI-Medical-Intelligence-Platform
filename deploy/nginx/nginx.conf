# Reverse proxy fronting the frontend SPA and the backend API.
upstream backend {
    server backend:8000;
}
upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # Uploads (PDF/images) may be up to ~15 MB.
    client_max_body_size 20m;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # API + backend-served routes.
    location /api/         { proxy_pass http://backend; include /etc/nginx/proxy_common.conf; }
    location /health/      { proxy_pass http://backend; include /etc/nginx/proxy_common.conf; }
    location /media/       { proxy_pass http://backend; include /etc/nginx/proxy_common.conf; }
    location /metrics      { proxy_pass http://backend; include /etc/nginx/proxy_common.conf; }
    location /docs         { proxy_pass http://backend; include /etc/nginx/proxy_common.conf; }
    location /redoc        { proxy_pass http://backend; include /etc/nginx/proxy_common.conf; }
    location /openapi.json { proxy_pass http://backend; include /etc/nginx/proxy_common.conf; }

    # Everything else → the SPA.
    location / {
        proxy_pass http://frontend;
        include /etc/nginx/proxy_common.conf;
    }
}
